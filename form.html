<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration form</title>
</head>
<h1> Student Registration Form</h1>
<body>
    <form>
        
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" ><br><br>
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email"><br><br>
    
        <label for="phone">Phone number</label>
        <input type="tel" id="tel" name="tel"><br><br>

        <fieldset>
        <legend>Gender:</legend><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>
        </fieldset><br><br>
        
        
        <label for="DOB">Date of birth</label>
        <input type="date" id="date" name="date"><br><br>
    
        <label for="course">Course</label><br><br>
         <select name="course" id="course">
            <option value="bca">BCA</option>
            <option value="btech">BTECH</option>
            <option value="mca">MCA</option>
            <option value="mtech">MTECH</option>
        </select><br><br>

        <fieldset>
        <legend>Skills</legend><br><br>
            <input type="checkbox" id="HTML" name="HTML" value="yes">
            <label for="html">HTML</label><br><br>

            <input type="checkbox" id="CSS" name="CSS" value="yes">
            <label for="css">CSS</label><br><br>

             <input type="checkbox" id="JAVASCRIPT" name="JAVASCRIPT" value="yes">
            <label for="javascript">JAVASCRIPT</label><br><br>

            <input type="checkbox" id="JAVA" name="JAVA" value="yes">
            <label for="java">JAVA</label><br><br>
        </fieldset>
            <label for="textarea">Address:</label><br>
            <textarea id="textarea" name="textarea" rows="4" cols="50"> </textarea><br><br>
              
            <label for="resume">upload resume:</label>
            <input type="file" name="file" id="file"><br><br>

             <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>

            <button type="submit">submit</button>
            <button type="submit">reset</button>
        </form>
    </body>
</html>
